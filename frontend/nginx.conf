server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Все запросы — через index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты с кешированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml text/javascript;
}
