server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — /admin/ и все подпути через index.html
    location /admin {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 301 /admin/;
    }

    # Статические ассеты с кешированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml text/javascript;
}
